name: Scheduled Cron Jobs

on:
  schedule:
    # Send scheduled newsletter campaigns — every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run manually"
        required: true
        type: choice
        options:
          - all
          - send-campaigns
          - publish-posts
          - mentor-reminders

env:
  SITE_URL: ${{ secrets.SITE_URL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}

jobs:
  # ──────────────────────────────────────────────
  # 1. Send scheduled newsletter campaigns
  #    Runs every 15 minutes
  # ──────────────────────────────────────────────
  send-campaigns:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'send-campaigns'))
    steps:
      - name: Trigger send-campaigns
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/send-campaigns")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -ge 400 ]; then
            echo "::error::send-campaigns failed with status $http_code"
            exit 1
          fi

  # ──────────────────────────────────────────────
  # 2. Auto-publish scheduled blog posts
  #    Runs every 15 minutes (same schedule)
  # ──────────────────────────────────────────────
  publish-posts:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'publish-posts'))
    steps:
      - name: Trigger publish-posts
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/publish-posts")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -ge 400 ]; then
            echo "::error::publish-posts failed with status $http_code"
            exit 1
          fi

  # ──────────────────────────────────────────────
  # 3. Mentor application reminders
  #    Runs once a week (Monday 9 AM UTC)
  # ──────────────────────────────────────────────
  mentor-reminders:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'mentor-reminders'))
    steps:
      - name: Check if Monday 9 AM UTC window
        id: check-day
        run: |
          day_of_week=$(date -u +%u)
          hour=$(date -u +%H)
          minute=$(date -u +%M)

          # Only run on Monday (1) between 09:00-09:14 UTC
          if [ "$day_of_week" = "1" ] && [ "$hour" = "09" ] && [ "$minute" -lt "15" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger mentor-reminders
        if: steps.check-day.outputs.should_run == 'true'
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/mentor-reminders")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -ge 400 ]; then
            echo "::error::mentor-reminders failed with status $http_code"
            exit 1
          fi
